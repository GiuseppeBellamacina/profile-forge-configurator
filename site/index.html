<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b5ff0">
  <title>profile-forge configurator</title>
  <meta name="description" content="Design your profile-forge GitHub card with a live preview, then publish config, workflow and assets to your profile repo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c83ff'/%3E%3Cpath d='M9 22V10h8a4 4 0 010 8h-4' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">pf</span><div><b>profile-forge</b> configurator<small>Live preview · publish to your profile repo</small></div></div>
    <nav class="links">
      <a href="https://github.com/GiuseppeBellamacina/profile-forge/blob/main/GUIDE.md" target="_blank" rel="noopener">Option guide</a>
      <a href="https://github.com/GiuseppeBellamacina/profile-forge" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <main class="layout">
    <section class="editor" aria-label="Options">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="panel" id="panel"></div>
    </section>

    <aside class="preview" id="preview" aria-label="Preview">
      <button class="handle" id="sheetToggle" aria-expanded="false" aria-controls="preview"><span class="grip"></span><span class="hl">Live preview</span><span class="chev" aria-hidden="true">⌃</span></button>
      <div class="bar">
        <div class="seg" id="slots" role="group" aria-label="Theme slot"></div>
        <span class="chip" id="source">demo data</span>
        <span class="grow"></span>
        <button class="btn sm" id="replay" title="Replay the animation">↻ Replay</button>
      </div>
      <div class="err" id="err" hidden></div>
      <div class="stage" id="stage"><img id="card" alt="Card preview"><div class="busy" id="busy">Rendering…</div></div>
      <details class="json"><summary>config.json</summary>
        <div class="row"><button class="btn sm" id="copyJson">Copy</button><button class="btn sm" id="dlJson">Download</button></div>
        <pre id="json"></pre>
      </details>
    </aside>
  </main>

  <dialog id="picker">
    <form method="dialog" class="pk-head"><b>Pick an icon</b><button class="btn sm">Close</button></form>
    <input id="pkSearch" type="search" placeholder="Search devicon (python, docker, react…)" autocomplete="off">
    <div id="pkGrid" class="pk-grid"></div>
    <div class="pk-custom">
      <b>Or use your own image</b>
      <div class="row"><input id="pkName" placeholder="Name"><input id="pkUrl" placeholder="https://…/logo.svg"><button class="btn sm" id="pkAdd" type="button">Add</button></div>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
