name: Deploy configurator

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_ref:
        description: profile-forge branch or tag to build against
        default: main
  # Fired by profile-forge when its renderer changes (optional): gh api repos/<owner>/profile-forge-configurator/dispatches -f event_type=core-updated
  repository_dispatch:
    types: [core-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CORE_DIR: core
      # URL of the OAuth worker, baked into the page at build time (empty = personal access token sign-in only).
      VITE_AUTH_URL: ${{ vars.AUTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GiuseppeBellamacina/profile-forge
          ref: ${{ inputs.core_ref || 'main' }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
